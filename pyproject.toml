[project]
name = "vesta-report-qa"
version = "0.13.0"
description = "Local paste-and-review prototype with durable QA execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]>=0.35,<1", "dbos==2.31.1",
  "dbos-openai-agents==0.3.0", "openai-agents==0.22.2", "python-dotenv>=1,<2", "socksio>=1,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
